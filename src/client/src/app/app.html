<main class="app-shell">
  <section class="topbar">
    <div>
      <p class="eyebrow">Local-first vehicle tracking</p>
      <h1>AutoSuivi</h1>
    </div>

    <app-portfolio-summary
      [vehicleCount]="vehicles().length"
      [totalInvestmentCents]="totalInvestmentCents()"
      [totalTargetMarginCents]="totalTargetMarginCents()"
    />
  </section>

  <section class="workspace">
    <app-vehicle-list
      [vehicles]="vehicles()"
      [loading]="loading()"
      [deletingVehicleId]="deletingVehicleId()"
      [addingExpenseVehicleId]="addingExpenseVehicleId()"
      [deletingExpenseId]="deletingExpenseId()"
      (createVehicle)="openVehicleForm()"
      (refresh)="loadVehicles()"
      (editVehicle)="editVehicle($event)"
      (deleteVehicle)="deleteVehicle($event)"
      (addExpense)="addExpense($event)"
      (deleteExpense)="deleteExpense($event)"
    />
  </section>
</main>

<app-modal *ngIf="vehicleFormOpen()" [title]="editingVehicle() ? 'Edit vehicle' : 'Add vehicle'" (closed)="closeVehicleForm()">
  <app-vehicle-form
    [saving]="saving()"
    [error]="error()"
    [resetVersion]="formResetVersion()"
    [vehicle]="editingVehicle()"
    [showHeader]="false"
    (cancelled)="cancelEdit()"
    (vehicleSubmitted)="saveVehicle($event)"
  />
</app-modal>

<app-confirm-modal
  *ngIf="pendingDelete()"
  [title]="deleteConfirmTitle()"
  [message]="deleteConfirmMessage()"
  confirmLabel="Delete"
  (cancelled)="cancelDelete()"
  (confirmed)="confirmDelete()"
/>

<app-toast-list [toasts]="toasts()" (dismissed)="dismissToast($event)" />

<router-outlet />
