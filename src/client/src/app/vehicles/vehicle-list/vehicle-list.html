<section class="vehicle-list" aria-label="Vehicles">
  <div class="list-head">
    <h2>Vehicles</h2>
    <button type="button" class="ghost" (click)="refresh.emit()" [disabled]="loading">Refresh</button>
  </div>

  <p class="empty" *ngIf="loading">Loading vehicles...</p>
  <p class="empty" *ngIf="!loading && vehicles.length === 0">No vehicles yet.</p>

  <app-vehicle-card
    *ngFor="let vehicle of vehicles; trackBy: trackByVehicleId"
    [vehicle]="vehicle"
    [deleting]="deletingVehicleId === vehicle.id"
    [addingExpense]="addingExpenseVehicleId === vehicle.id"
    [deletingExpenseId]="deletingExpenseId"
    (deleteRequested)="deleteVehicle.emit($event)"
    (editRequested)="editVehicle.emit($event)"
    (expenseSubmitted)="addExpense.emit($event)"
    (expenseDeleteRequested)="deleteExpense.emit($event)"
  />
</section>
